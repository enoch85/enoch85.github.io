version: 2
updates:
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 3
    open-pull-requests-limit: 10
    groups:
      npm-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "pip"
    directory: "/cv-generator"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 3
    # Raise the version floors so requirements.txt records each update.
    versioning-strategy: "increase"
    groups:
      python-dependencies:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "automated"]
    commit-message:
      prefix: "deps"
      include: "scope"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "06:00"
      timezone: "Europe/Stockholm"
    cooldown:
      default-days: 3
    groups:
      github-actions:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    labels: ["dependencies", "github-actions", "automated"]
    commit-message:
      prefix: "ci"
